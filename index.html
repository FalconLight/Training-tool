<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Training Console</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
</head>
<body>
  <!-- UI BUTTONS -->
  <button id="help-btn" title="How this works">?</button>
  <button id="settings-btn" title="Settings">
    <span></span>
    <span></span>
    <span></span>
  </button>

  <div id="metronome-container">
      <button id="metronome-toggle-collapse-btn" title="Toggle Metronome Controls">
          <span class="icon">&#9835;</span>
      </button>
      <div id="metronome-controls">
          <button id="metronome-toggle-btn" title="Start/Stop Metronome">&#9658;</button>
          <div class="bpm-group">
              <input type="number" id="metronome-bpm-input" value="60" min="10" max="480" step="1" title="Beats Per Minute">
          </div>
          <div id="metronome-wave-selector">
              <button class="wave-btn" data-wave="square" title="Square Wave">&#9634;</button>
              <button class="wave-btn" data-wave="triangle" title="Triangle Wave">&#9651;</button>
          </div>
      </div>
  </div>

  <div id="settings-panel">
      <button id="close-settings-btn" title="Close Settings">&times;</button>
      <h2>Settings</h2>

      <div id="theme-settings">
          <h3>Theme</h3>
      </div>

      <div id="custom-theme-section">
          <button id="custom-theme-btn" class="theme-button" data-theme="custom">Custom</button>
          <div id="custom-theme-panel">
              <div class="custom-color-row">
                  <label for="custom-color-bg">Background</label>
                  <input type="color" id="custom-color-bg">
              </div>
              <div class="custom-color-row">
                  <label for="custom-color-text">Text</label>
                  <input type="color" id="custom-color-text">
              </div>
              <div class="custom-color-row">
                  <label for="custom-color-confirm">Confirm</label>
                  <input type="color" id="custom-color-confirm">
              </div>
              <div class="custom-color-row">
                  <label for="custom-color-highlight">Highlight</label>
                  <input type="color" id="custom-color-highlight">
              </div>
          </div>
      </div>

      <div id="customization-settings">
          <h3>Customization</h3>
          <div class="setting-item">
              <label for="confirm-word-input">Who Owns You?</label>
              <input type="text" id="confirm-word-input">
          </div>
          <div class="setting-item">
              <label for="praise-term-input">Praise Term:</label>
              <input type="text" id="praise-term-input">
          </div>
      </div>

      <div id="data-settings">
          <h3>Phrase Packs &amp; Themes</h3>

          <div class="data-row">
              <span class="data-row-label">Phrases</span>
              <div class="data-row-buttons">
                  <button id="import-phrases-btn" class="data-button">Import…</button>
                  <button id="export-phrases-btn" class="data-button">Export</button>
              </div>
          </div>

          <button id="add-category-btn" class="data-button">+ Add Category</button>
          <div id="add-category-panel">
              <input type="text" id="new-category-name" placeholder="Category name">
              <textarea id="new-category-phrases" placeholder="One phrase per line" rows="5"></textarea>
              <button id="save-category-btn" class="data-button">Save Category</button>
          </div>

          <div class="data-row">
              <span class="data-row-label">Themes</span>
              <div class="data-row-buttons">
                  <button id="import-themes-btn" class="data-button">Import…</button>
                  <button id="export-themes-btn" class="data-button">Export</button>
              </div>
          </div>

          <div id="data-status" class="data-status"></div>

          <button id="reset-data-btn" class="data-button">Reset to defaults</button>
          <div id="reset-confirm-row">
              <span>This deletes any imported/custom phrases and themes. Are you sure?</span>
              <div class="reset-confirm-buttons">
                  <button id="reset-confirm-yes-btn" class="data-button">Yes, reset</button>
                  <button id="reset-confirm-cancel-btn" class="data-button">Cancel</button>
              </div>
          </div>

          <!-- Inputs de archivo ocultos, disparados por los botones de arriba -->
          <input type="file" id="import-phrases-file" accept="application/json" style="display:none">
          <input type="file" id="import-themes-file" accept="application/json" style="display:none">
      </div>
  </div>

  <!-- MAIN CONSOLE LAYOUT -->
  <div class="crt-container">
    <div id="title">TRAINING ROUTINE</div>

    <div id="loading-screen">
      <div id="time-button-group">
        <button id="min1-btn" class="control-button">+1 min</button>
        <button id="min10-btn" class="control-button">+10 min</button>
        <button id="hour1-btn" class="control-button">+1 hour</button>
        <button id="extend-btn" class="control-button" title="Extend time randomly">&lt;3</button>
      </div>

      <div id="category-management">
          <button id="select-all-btn" class="control-button manage-button">Select All</button>
          <button id="deselect-all-btn" class="control-button manage-button">Deselect All</button>
      </div>

      <div id="category-selection"></div>

      <button id="start-btn">Start Training</button>

      <div id="timer-container">
          <div id="timer">00:00</div>
      </div>
    </div>

    <div id="main-panel">
      <div id="fake-timer">00:00</div>
      <div id="techno-log" class="log-panel"></div>
      <div id="center-log" class="log-panel"></div>
      <div id="right-log" class="log-panel"></div>
    </div>

    <div id="confirmation-popup">
        <label for="confirmation-input">Who owns you?</label>
        <input type="text" id="confirmation-input" />
        <button id="confirmation-button">Submit</button>
    </div>
  </div>

  <!-- Toast fijo para mensajes de validación / feedback (separado de los popups temáticos) -->
  <div id="ui-toast"></div>

  <!-- Tutorial modal -->
  <div id="tutorial-overlay">
    <div id="tutorial-modal">
      <button id="close-tutorial-btn" title="Close">&times;</button>
      <h2 id="tutorial-step-heading">How Training Console works</h2>

      <div id="tutorial-step-body"></div>

      <div id="tutorial-nav">
        <span id="tutorial-step-indicator"></span>
        <div id="tutorial-nav-buttons">
          <button id="tutorial-back-btn">Back</button>
          <button id="tutorial-next-btn">Next</button>
        </div>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
